<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala de Cinema — P2P Stream Original (Estabilizado)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <style>
    :root {
      --bg-dark: #09090b;
      --bg-panel: #121216;
      --bg-input: #1c1c22;
      --border: #27272f;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tela Inicial / Lobby */
    #lobby-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lobby-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    .lobby-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .lobby-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: #272730; }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      position: relative;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* Tela da Sala de Cinema */
    #cinema-screen {
      display: none;
      flex: 1;
      height: 100vh;
      grid-template-columns: 1fr 340px;
    }

    /* Área do Vídeo */
    .stage {
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .room-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .room-code {
      background: var(--bg-input);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: bold;
      color: var(--accent);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .host-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quality-tag {
      font-size: 0.75rem;
      background: #14532d;
      color: #86efac;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .file-label {
      background: var(--accent);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .file-label:hover { background: var(--accent-hover); }
    #video-file-input { display: none; }

    .video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 58px);
      object-fit: contain;
      background: #000;
    }

    #status-overlay {
      position: absolute;
      text-align: center;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 20px;
      border-radius: 8px;
      pointer-events: none;
      font-size: 0.95rem;
      max-width: 85%;
    }

    /* Chat Lateral */
    .sidebar {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewers-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      background: var(--bg-input);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg-author {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .msg-system {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
    }

    .chat-form {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .chat-form input {
      flex: 1;
      padding: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
    }
    .chat-form input:focus { outline: none; border-color: var(--accent); }
    .chat-form button {
      padding: 0 16px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      #cinema-screen { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
      .sidebar { height: 45vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <!-- TELA 1: LOBBY -->
  <div id="lobby-screen">
    <div class="lobby-card">
      <h1>🍿 Sala de Cinema</h1>
      <p>Streaming P2P direto do arquivo MP4 com 100% da qualidade original.</p>

      <div class="form-group">
        <label for="username-input">Seu Apelido</label>
        <input type="text" id="username-input" placeholder="Ex: Sentinela" maxlength="20" />
      </div>

      <button class="btn btn-primary" id="create-room-btn">Criar Nova Sala (Host)</button>

      <div class="divider">OU ENTRE NUMA SALA</div>

      <div class="form-group">
        <label for="room-code-input">Código da Sala</label>
        <input type="text" id="room-code-input" placeholder="Ex: CINE-4821" style="text-transform: uppercase;" />
      </div>

      <button class="btn btn-secondary" id="join-room-btn">Entrar como Convidado</button>
    </div>
  </div>

  <!-- TELA 2: CINEMA -->
  <div id="cinema-screen">
    <div class="stage">
      <div class="topbar">
        <div class="room-badge">
          <span>Sala:</span>
          <span class="room-code" id="display-room-code" title="Clique para copiar">---</span>
          <span class="quality-tag" id="quality-badge">Qualidade Original</span>
        </div>

        <div class="host-controls" id="host-controls" style="display: none;">
          <label for="video-file-input" class="file-label">📁 Escolher Vídeo (.mp4)</label>
          <input type="file" id="video-file-input" accept="video/mp4" />
        </div>
      </div>

      <div class="video-container">
        <div id="status-overlay">Aguardando vídeo ser carregado...</div>
        <video id="cinema-video" playsinline></video>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <span>Chat da Sessão</span>
        <span class="viewers-count" id="viewers-count">1 online</span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="Enviar mensagem..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <!-- Firebase Modular SDK (v11) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, updateDoc,
      collection, addDoc, onSnapshot, query, orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // =========================================================================
    // 1. CREDENCIAIS DO FIREBASE
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyB3cclEOHQbHv7J-Sa49cLTEB2eoefnKIA",
      authDomain: "sala-b91fa.firebaseapp.com",
      projectId: "sala-b91fa",
      storageBucket: "sala-b91fa.firebasestorage.app",
      messagingSenderId: "460079159474",
      appId: "1:460079159474:web:c0b6b5c0d14acd9e8c51ab",
      measurementId: "G-QB5V3X0N1H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Constantes de Controle de Vazão WebRTC (Evita engasgo no Wi-Fi)
    const PACKET_SIZE = 64 * 1024; // 64 KB por pacote
    const MAX_BUFFERED_AMOUNT = 512 * 1024; // Pausa envio se fila passar de 512 KB

    // Variáveis de Estado Geral
    let peer = null;
    let myPeerId = null;
    let currentRoomId = null;
    let currentUser = "";
    let isHost = false;

    // Variáveis do Host
    let mediaReady = false;
    let mediaMeta = null;
    const guestConnections = new Map();
    const guestSendQueues = new Map(); // guestPeerId -> Array<Function>
    const guestSendingFlags = new Map();

    // Variáveis do Convidado (MSE + Reassembly + GC)
    let hostConnection = null;
    let mediaSource = null;
    let sourceBuffers = {};
    let appendQueues = {};
    let guestTrackMeta = {};
    let inFlightRequests = {}; // trackId -> Set<segIndex>
    let incomingChunks = {};   // `${trackId}_${segIndex}` -> { total, received, parts[] }
    let currentSeekEpoch = 0;  // Ignora pacotes atrasados de antes de um seek
    let lastKnownHostTime = -1;

    // Elementos DOM
    const lobbyScreen = document.getElementById("lobby-screen");
    const cinemaScreen = document.getElementById("cinema-screen");
    const usernameInput = document.getElementById("username-input");
    const roomCodeInput = document.getElementById("room-code-input");
    const createRoomBtn = document.getElementById("create-room-btn");
    const joinRoomBtn = document.getElementById("join-room-btn");
    const displayRoomCode = document.getElementById("display-room-code");
    const hostControls = document.getElementById("host-controls");
    const videoFileInput = document.getElementById("video-file-input");
    const videoEl = document.getElementById("cinema-video");
    const statusOverlay = document.getElementById("status-overlay");
    const chatMessages = document.getElementById("chat-messages");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const viewersCount = document.getElementById("viewers-count");
    const qualityBadge = document.getElementById("quality-badge");

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("sala")) {
      roomCodeInput.value = urlParams.get("sala").toUpperCase();
    }

    // =========================================================================
    // 2. INICIALIZAÇÃO DO PEERJS
    // =========================================================================
    function initPeer() {
      return new Promise((resolve, reject) => {
        if (typeof Peer === "undefined") {
          return reject(new Error("PeerJS não carregou."));
        }
        const timeout = setTimeout(() => {
          reject(new Error("Timeout ao conectar no servidor P2P."));
        }, 10000);

        peer = new Peer({
          config: {
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" }
            ]
          }
        });

        peer.on("open", (id) => {
          clearTimeout(timeout);
          myPeerId = id;
          resolve(id);
        });

        peer.on("error", (err) => {
          clearTimeout(timeout);
          console.error("Erro PeerJS:", err);
          reject(err);
        });
      });
    }

    // =========================================================================
    // 3. HOST: CRIAR SALA E ENVIAR PACOTES FATIADOS COM CONTROLE DE VAZÃO
    // =========================================================================
    createRoomBtn.addEventListener("click", async () => {
      const name = usernameInput.value.trim();
      if (!name) return alert("Digite seu apelido primeiro.");

      createRoomBtn.disabled = true;
      createRoomBtn.textContent = "Conectando...";

      currentUser = name;
      isHost = true;
      currentRoomId = "CINE-" + Math.floor(1000 + Math.random() * 9000);

      try {
        await initPeer();

        peer.on("connection", (conn) => {
          guestConnections.set(conn.peer, conn);
          guestSendQueues.set(conn.peer, []);
          guestSendingFlags.set(conn.peer, false);
          updateOnlineCount();

          conn.on("open", () => {
            if (mediaReady && mediaMeta) {
              sendInitManifestToGuest(conn);
            }
          });

          conn.on("data", (msg) => {
            if (!msg) return;
            if (msg.type === "REQ_SEGMENT") {
              enqueueSegmentForGuest(conn, msg.trackId, msg.segIndex, msg.epoch);
            } else if (msg.type === "CLEAR_QUEUE") {
              // Limpa pacotes pendentes antigos quando o convidado dá seek
              guestSendQueues.set(conn.peer, []);
            }
          });

          conn.on("close", () => {
            guestConnections.delete(conn.peer);
            guestSendQueues.delete(conn.peer);
            guestSendingFlags.delete(conn.peer);
            updateOnlineCount();
          });
        });

        await setDoc(doc(db, "salas", currentRoomId), {
          hostPeerId: myPeerId,
          hostName: currentUser,
          playback: { isPlaying: false, currentTime: 0, seekId: 0, updatedAt: Date.now() },
          createdAt: serverTimestamp()
        });

        enterCinemaUI();
        hostControls.style.display = "flex";
        videoEl.controls = true;
        statusOverlay.textContent = "Clique em 'Escolher Vídeo (.mp4)' acima para iniciar.";

        setupHostPlaybackSync();
        await sendSystemMessage(`${currentUser} abriu a sala.`);
        listenToChat();
      } catch (e) {
        console.error(e);
        alert("Erro ao criar sala: " + (e.message || e));
        createRoomBtn.disabled = false;
        createRoomBtn.textContent = "Criar Nova Sala (Host)";
      }
    });

    function updateOnlineCount() {
      viewersCount.textContent = `${guestConnections.size + 1} online`;
    }

    videoFileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusOverlay.style.display = "block";
      statusOverlay.textContent = "Indexando faixas originais (aguarde)...";
      videoEl.src = URL.createObjectURL(file);

      try {
        mediaMeta = await fragmentLocalMP4(file);
        mediaReady = true;

        const videoTrack = mediaMeta.tracks.find((t) => t.mime.startsWith("video/"));
        if (videoTrack) {
          qualityBadge.textContent = `Original (${videoTrack.width}x${videoTrack.height})`;
        }

        statusOverlay.style.display = "none";
        await videoEl.play();

        guestConnections.forEach((conn) => {
          guestSendQueues.set(conn.peer, []);
          if (conn.open) sendInitManifestToGuest(conn);
        });

        sendSystemMessage(`🎬 Filme carregado em qualidade original: ${file.name}`);
      } catch (err) {
        console.error(err);
        statusOverlay.textContent = "Erro ao ler MP4. Use um arquivo .mp4 (H.264 + AAC).";
      }
    });

    function fragmentLocalMP4(file) {
      return new Promise((resolve, reject) => {
        const mp4boxfile = MP4Box.createFile();
        const tracksMap = {};
        let movieDuration = 0;

        mp4boxfile.onError = (e) => reject(e);

        mp4boxfile.onReady = (info) => {
          movieDuration = info.duration / info.timescale;

          info.tracks.forEach((track) => {
            if (track.type !== "video" && track.type !== "audio") return;

            const mime = track.type === "video"
              ? `video/mp4; codecs="${track.codec}"`
              : `audio/mp4; codecs="${track.codec}"`;

            tracksMap[track.id] = {
              id: track.id,
              type: track.type,
              mime: mime,
              width: track.video ? track.video.width : 0,
              height: track.video ? track.video.height : 0,
              initBuffer: null,
              segments: []
            };

            // Segmentos menores (~1.5s / 36 frames) para resposta rápida no Wi-Fi
            mp4boxfile.setSegmentOptions(track.id, null, { nbSamples: 36 });
          });

          const initSegs = mp4boxfile.initializeSegmentation();
          initSegs.forEach((seg) => {
            if (tracksMap[seg.id]) {
              tracksMap[seg.id].initBuffer = seg.buffer;
            }
          });

          mp4boxfile.start();
        };

        mp4boxfile.onSegment = (id, user, buffer) => {
          const track = tracksMap[id];
          if (!track) return;
          track.segments.push({
            index: track.segments.length,
            buffer: buffer
          });
        };

        const chunkSize = 2 * 1024 * 1024;
        let offset = 0;
        const reader = new FileReader();

        reader.onload = (e) => {
          const buf = e.target.result;
          buf.fileStart = offset;
          mp4boxfile.appendBuffer(buf);
          offset += buf.byteLength;

          if (offset < file.size) {
            readNextChunk();
          } else {
            mp4boxfile.flush();
            const validTracks = Object.values(tracksMap).filter((t) => t.initBuffer && t.segments.length > 0);
            if (validTracks.length === 0) {
              return reject(new Error("Nenhuma faixa compatível encontrada."));
            }
            resolve({ duration: movieDuration, tracks: validTracks });
          }
        };

        reader.onerror = (err) => reject(err);
        function readNextChunk() {
          reader.readAsArrayBuffer(file.slice(offset, offset + chunkSize));
        }
        readNextChunk();
      });
    }

    function sendInitManifestToGuest(conn) {
      conn.send({
        type: "INIT_MANIFEST",
        duration: mediaMeta.duration,
        tracks: mediaMeta.tracks.map((t) => ({
          id: t.id,
          type: t.type,
          mime: t.mime,
          width: t.width,
          height: t.height,
          totalSegments: t.segments.length,
          initBuffer: t.initBuffer
        }))
      });
    }

    // Fatia cada segmento em pacotes de 64 KB e respeita o limite de buffer da rede
    function enqueueSegmentForGuest(conn, trackId, segIndex, epoch) {
      if (!mediaMeta) return;
      const track = mediaMeta.tracks.find((t) => t.id === trackId);
      if (!track || !track.segments[segIndex]) return;

      const fullBuffer = track.segments[segIndex].buffer;
      const totalParts = Math.ceil(fullBuffer.byteLength / PACKET_SIZE);
      const queue = guestSendQueues.get(conn.peer);
      if (!queue) return;

      for (let partIdx = 0; partIdx < totalParts; partIdx++) {
        const start = partIdx * PACKET_SIZE;
        const end = Math.min(start + PACKET_SIZE, fullBuffer.byteLength);
        const slice = fullBuffer.slice(start, end);

        queue.push({
          type: "SEGMENT_CHUNK",
          trackId: trackId,
          segIndex: segIndex,
          epoch: epoch,
          partIdx: partIdx,
          totalParts: totalParts,
          chunk: slice
        });
      }

      drainGuestSendQueue(conn);
    }

    function drainGuestSendQueue(conn) {
      if (!conn || !conn.open) return;
      if (guestSendingFlags.get(conn.peer)) return;

      const queue = guestSendQueues.get(conn.peer);
      if (!queue || queue.length === 0) return;

      guestSendingFlags.set(conn.peer, true);

      const pump = () => {
        if (!conn.open) {
          guestSendingFlags.set(conn.peer, false);
          return;
        }

        const dc = conn.dataChannel;
        while (queue.length > 0) {
          // Se o buffer do WebRTC passou de 512 KB, espera 15ms antes de mandar mais
          if (dc && dc.bufferedAmount > MAX_BUFFERED_AMOUNT) {
            setTimeout(pump, 15);
            return;
          }
          const packet = queue.shift();
          try {
            conn.send(packet);
          } catch (e) {
            console.warn("Erro no envio P2P:", e);
            break;
          }
        }

        guestSendingFlags.set(conn.peer, false);
      };

      pump();
    }

    function setupHostPlaybackSync() {
      const roomRef = doc(db, "salas", currentRoomId);
      let seekCounter = 0;

      const syncState = (isSeek = false) => {
        if (isSeek) seekCounter++;
        updateDoc(roomRef, {
          playback: {
            isPlaying: !videoEl.paused,
            currentTime: videoEl.currentTime,
            seekId: seekCounter,
            updatedAt: Date.now()
          }
        }).catch(() => {});
      };

      videoEl.addEventListener("play", () => syncState(false));
      videoEl.addEventListener("pause", () => syncState(false));
      videoEl.addEventListener("seeked", () => syncState(true));
    }

    // =========================================================================
    // 4. CONVIDADO: REMONTAGEM DE PACOTES + RESET NO SEEK + LIMPEZA DE RAM
    // =========================================================================
    joinRoomBtn.addEventListener("click", async () => {
      const name = usernameInput.value.trim();
      const code = roomCodeInput.value.trim().toUpperCase();
      if (!name || !code) return alert("Preencha seu apelido e o código da sala.");

      joinRoomBtn.disabled = true;
      joinRoomBtn.textContent = "Entrando...";

      currentUser = name;
      isHost = false;
      currentRoomId = code;

      try {
        const roomRef = doc(db, "salas", currentRoomId);
        const roomSnap = await getDoc(roomRef);

        if (!roomSnap.exists()) {
          joinRoomBtn.disabled = false;
          joinRoomBtn.textContent = "Entrar como Convidado";
          return alert("Sala não encontrada!");
        }

        const hostPeerId = roomSnap.data().hostPeerId;
        await initPeer();

        hostConnection = peer.connect(hostPeerId, { reliable: true });

        hostConnection.on("open", () => {
          enterCinemaUI();
          videoEl.controls = true;
          statusOverlay.textContent = "Conectado! Aguardando o Host iniciar o filme...";
          sendSystemMessage(`${currentUser} entrou na sala.`);
          listenToHostPlayback();
          listenToChat();
        });

        hostConnection.on("data", (msg) => {
          if (!msg || !msg.type) return;
          if (msg.type === "INIT_MANIFEST") {
            initGuestMediaSource(msg);
          } else if (msg.type === "SEGMENT_CHUNK") {
            handleIncomingChunk(msg);
          }
        });

        hostConnection.on("close", () => {
          statusOverlay.style.display = "block";
          statusOverlay.textContent = "Conexão com o Host encerrada.";
        });
      } catch (e) {
        console.error(e);
        alert("Erro ao conectar na sala: " + (e.message || e));
        joinRoomBtn.disabled = false;
        joinRoomBtn.textContent = "Entrar como Convidado";
      }
    });

    function initGuestMediaSource(manifest) {
      statusOverlay.style.display = "block";
      statusOverlay.textContent = "Carregando buffer em qualidade original...";

      const videoTrack = manifest.tracks.find((t) => t.type === "video");
      if (videoTrack && videoTrack.width) {
        qualityBadge.textContent = `Original (${videoTrack.width}x${videoTrack.height})`;
      }

      sourceBuffers = {};
      appendQueues = {};
      guestTrackMeta = {};
      inFlightRequests = {};
      incomingChunks = {};
      currentSeekEpoch++;

      mediaSource = new MediaSource();
      videoEl.src = URL.createObjectURL(mediaSource);

      mediaSource.addEventListener("sourceopen", () => {
        try {
          if (isFinite(manifest.duration) && manifest.duration > 0) {
            mediaSource.duration = manifest.duration;
          }
        } catch (e) {}

        manifest.tracks.forEach((track) => {
          if (!MediaSource.isTypeSupported(track.mime)) return;

          const sb = mediaSource.addSourceBuffer(track.mime);
          sourceBuffers[track.id] = sb;
          appendQueues[track.id] = [track.initBuffer];
          inFlightRequests[track.id] = new Set();
          guestTrackMeta[track.id] = {
            totalSegments: track.totalSegments,
            nextSegmentToRequest: 0,
            duration: manifest.duration,
            isCleaning: false
          };

          sb.addEventListener("updateend", () => {
            guestTrackMeta[track.id].isCleaning = false;
            processAppendQueue(track.id);
            fillAheadBuffer(track.id);
          });

          processAppendQueue(track.id);
          // Pede os primeiros 3 segmentos (~4.5s) de forma leve
          for (let i = 0; i < Math.min(3, track.totalSegments); i++) {
            requestNextSegment(track.id);
          }
        });
      });

      // Loop de manutenção do buffer e limpeza de RAM passada
      setInterval(() => {
        Object.keys(guestTrackMeta).forEach((idStr) => {
          const trackId = Number(idStr);
          cleanupOldBuffer(trackId);
          fillAheadBuffer(trackId);
        });
      }, 1000);

      videoEl.addEventListener("click", () => {
        if (videoEl.muted) videoEl.muted = false;
        if (videoEl.paused) videoEl.play().catch(() => {});
        statusOverlay.style.display = "none";
      });
    }

    // Remonta os pacotes de 64 KB no segmento completo
    function handleIncomingChunk(msg) {
      // Descarta pacotes atrasados que pertenciam a antes de um seek
      if (msg.epoch !== currentSeekEpoch) return;

      const key = `${msg.trackId}_${msg.segIndex}`;
      if (!incomingChunks[key]) {
        incomingChunks[key] = {
          total: msg.totalParts,
          received: 0,
          parts: new Array(msg.totalParts)
        };
      }

      const entry = incomingChunks[key];
      if (!entry.parts[msg.partIdx]) {
        entry.parts[msg.partIdx] = msg.chunk;
        entry.received++;
      }

      if (entry.received === entry.total) {
        delete incomingChunks[key];
        if (inFlightRequests[msg.trackId]) {
          inFlightRequests[msg.trackId].delete(msg.segIndex);
        }

        // Junta todos os pedaços em um único ArrayBuffer
        let totalBytes = 0;
        for (const part of entry.parts) totalBytes += part.byteLength;
        const merged = new Uint8Array(totalBytes);
        let offset = 0;
        for (const part of entry.parts) {
          merged.set(new Uint8Array(part), offset);
          offset += part.byteLength;
        }

        if (appendQueues[msg.trackId]) {
          appendQueues[msg.trackId].push(merged.buffer);
          processAppendQueue(msg.trackId);
        }

        // Esconde aviso de carregamento assim que houver buffer suficiente
        if (videoEl.buffered.length > 0) {
          const bufEnd = videoEl.buffered.end(videoEl.buffered.length - 1);
          if (bufEnd - videoEl.currentTime > 1.5 && statusOverlay.textContent.includes("Carregando")) {
            statusOverlay.style.display = "none";
          }
        }
      }
    }

    function processAppendQueue(trackId) {
      const sb = sourceBuffers[trackId];
      const queue = appendQueues[trackId];
      if (!sb || sb.updating || !queue || queue.length === 0) return;

      const nextBuf = queue.shift();
      try {
        sb.appendBuffer(nextBuf);
      } catch (e) {
        // Se a memória do SourceBuffer encher (QuotaExceededError), limpa o passado
        if (e.name === "QuotaExceededError") {
          queue.unshift(nextBuf);
          cleanupOldBuffer(trackId, true);
        }
      }
    }

    // Limpa trechos já assistidos (mais de 15s atrás) para não estourar RAM no celular
    function cleanupOldBuffer(trackId, force = false) {
      const sb = sourceBuffers[trackId];
      const meta = guestTrackMeta[trackId];
      if (!sb || sb.updating || !meta || meta.isCleaning || sb.buffered.length === 0) return;

      const start = sb.buffered.start(0);
      const safeCut = videoEl.currentTime - (force ? 5 : 15);
      if (safeCut > start + 2) {
        try {
          meta.isCleaning = true;
          sb.remove(start, safeCut);
        } catch (e) {
          meta.isCleaning = false;
        }
      }
    }

    function requestNextSegment(trackId) {
      const meta = guestTrackMeta[trackId];
      if (!meta || meta.nextSegmentToRequest >= meta.totalSegments) return;

      // Limita a no máximo 2 segmentos em trânsito simultâneo para não congestionar o Wi-Fi
      if (inFlightRequests[trackId] && inFlightRequests[trackId].size >= 2) return;

      const idx = meta.nextSegmentToRequest++;
      if (inFlightRequests[trackId]) inFlightRequests[trackId].add(idx);

      if (hostConnection && hostConnection.open) {
        hostConnection.send({
          type: "REQ_SEGMENT",
          trackId: trackId,
          segIndex: idx,
          epoch: currentSeekEpoch
        });
      }
    }

    function fillAheadBuffer(trackId) {
      const sb = sourceBuffers[trackId];
      const meta = guestTrackMeta[trackId];
      if (!sb || !meta || meta.nextSegmentToRequest >= meta.totalSegments) return;

      let bufferedEnd = videoEl.currentTime;
      for (let i = 0; i < sb.buffered.length; i++) {
        if (videoEl.currentTime >= sb.buffered.start(i) - 1 && videoEl.currentTime <= sb.buffered.end(i) + 1) {
          bufferedEnd = sb.buffered.end(i);
          break;
        }
      }

      // Mantém ~12 segundos de buffer adiantado (equilíbrio ideal entre fluidez e rede leve)
      if (bufferedEnd - videoEl.currentTime < 12 && appendQueues[trackId].length < 3) {
        requestNextSegment(trackId);
      }
    }

    // Reseta o SourceBuffer limpo quando o Host pula de cena (Seek)
    function resetBuffersForSeek(targetTime) {
      currentSeekEpoch++;
      incomingChunks = {};

      if (hostConnection && hostConnection.open) {
        hostConnection.send({ type: "CLEAR_QUEUE" });
      }

      statusOverlay.style.display = "block";
      statusOverlay.textContent = "Carregando nova cena...";

      Object.keys(sourceBuffers).forEach((idStr) => {
        const trackId = Number(idStr);
        const sb = sourceBuffers[trackId];
        const meta = guestTrackMeta[trackId];
        if (!sb || !meta) return;

        appendQueues[trackId] = [];
        inFlightRequests[trackId] = new Set();

        if (meta.duration > 0 && meta.totalSegments > 0) {
          const targetIdx = Math.floor((targetTime / meta.duration) * meta.totalSegments);
          meta.nextSegmentToRequest = Math.max(0, Math.min(targetIdx, meta.totalSegments - 1));
        }

        try {
          if (sb.updating) sb.abort();
          if (sb.buffered.length > 0) {
            meta.isCleaning = true;
            sb.remove(0, Infinity);
          }
        } catch (e) {}

        // Pede os 2 primeiros segmentos do novo minuto imediatamente
        setTimeout(() => {
          requestNextSegment(trackId);
          requestNextSegment(trackId);
        }, 50);
      });

      videoEl.currentTime = targetTime;
    }

    let lastSeekId = -1;

    function listenToHostPlayback() {
      onSnapshot(doc(db, "salas", currentRoomId), (snap) => {
        if (!snap.exists()) return;
        const data = snap.data();
        const pb = data.playback;
        if (!pb) return;

        // Detecta se houve seek explícito do Host ou dessincronia grande (> 3s)
        const seekChanged = pb.seekId !== undefined && pb.seekId !== lastSeekId && lastSeekId !== -1;
        lastSeekId = pb.seekId ?? 0;

        if (seekChanged || Math.abs(videoEl.currentTime - pb.currentTime) > 3.5) {
          resetBuffersForSeek(pb.currentTime);
        }

        if (pb.isPlaying && videoEl.paused) {
          videoEl.play().then(() => {
            statusOverlay.style.display = "none";
          }).catch(() => {
            videoEl.muted = true;
            videoEl.play();
            statusOverlay.style.display = "block";
            statusOverlay.textContent = "Toque no vídeo para ativar o áudio original 🔊";
          });
        } else if (!pb.isPlaying && !videoEl.paused) {
          videoEl.pause();
        }
      });
    }

    // =========================================================================
    // 5. CHAT E UTILITÁRIOS
    // =========================================================================
    function listenToChat() {
      const q = query(
        collection(db, "salas", currentRoomId, "mensagens"),
        orderBy("createdAt", "asc")
      );

      onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const div = document.createElement("div");

          if (msg.system) {
            div.className = "msg-system";
            div.textContent = msg.text;
          } else {
            div.className = "msg";
            div.innerHTML = `<div class="msg-author">${escapeHTML(msg.author)}</div><div>${escapeHTML(msg.text)}</div>`;
          }
          chatMessages.appendChild(div);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || !currentRoomId) return;

      chatInput.value = "";
      await addDoc(collection(db, "salas", currentRoomId, "mensagens"), {
        author: currentUser,
        text: text,
        system: false,
        createdAt: serverTimestamp()
      });
    });

    async function sendSystemMessage(text) {
      await addDoc(collection(db, "salas", currentRoomId, "mensagens"), {
        text: text,
        system: true,
        createdAt: serverTimestamp()
      });
    }

    function enterCinemaUI() {
      lobbyScreen.style.display = "none";
      cinemaScreen.style.display = "grid";
      displayRoomCode.textContent = currentRoomId;

      const newUrl = `${window.location.origin}${window.location.pathname}?sala=${currentRoomId}`;
      window.history.replaceState({}, "", newUrl);
    }

    displayRoomCode.addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href);
      const original = displayRoomCode.textContent;
      displayRoomCode.textContent = "Link Copiado!";
      setTimeout(() => (displayRoomCode.textContent = original), 1500);
    });

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
